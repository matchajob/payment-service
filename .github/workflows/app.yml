name: app

on:
  push:

permissions:
  contents: read
  id-token: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payment_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payment_service_test
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCHA_INFRA_DEPLOY_KEY }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: every schema change has its committed migration
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain drizzle)" || { git status --porcelain drizzle; exit 1; }
      - run: pnpm test:run

  deploy-staging:
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    environment: staging
    env:
      STACK: staging
      MIGRATE_JOB: payment-service-migrate
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/payment-service/payment-service:${{ github.sha }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCHA_INFRA_DEPLOY_KEY }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: build and push the image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          DOCKER_BUILDKIT=1 docker build --ssh default -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: pulumi/actions@v6

      - name: point the stack at this commit's image
        working-directory: iac
        run: |
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi stack select "$STACK"
          pulumi config set image "$IMAGE"

      - name: migrate before the service sees the new code
        working-directory: iac
        run: |
          pulumi up --yes --target "urn:pulumi:$STACK::payment-service::gcp:cloudrunv2/job:Job::$MIGRATE_JOB"
          gcloud run jobs execute "$MIGRATE_JOB" --region "${{ vars.GCP_REGION }}" --project "${{ vars.GCP_PROJECT }}" --wait

      - name: update the service and the rest of the stack
        working-directory: iac
        run: pulumi up --yes
